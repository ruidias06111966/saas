name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construir o site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Diz, no log, se o site vai subir em modo online ou demo — e, quando
      # estiver errado, onde está o engano. Nenhum valor é impresso: a chave
      # publicável é pública, mas segredo nenhum deve virar hábito de log.
      - name: Conferir a configuração
        env:
          VAR_URL: ${{ vars.VITE_SUPABASE_URL }}
          VAR_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VAR_DSN: ${{ vars.VITE_SENTRY_DSN }}
          # Lidos só para detectar o engano mais comum: guardar em Secrets, que
          # é a aba vizinha. O site não lê daqui — o Build usa `vars.`.
          SEC_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SEC_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          diz() { if [ -n "$2" ]; then echo "  $1: definida"; else echo "  $1: VAZIA"; fi; }
          echo "Em Variables (é daqui que o site lê):"
          diz VITE_SUPABASE_URL             "$VAR_URL"
          diz VITE_SUPABASE_PUBLISHABLE_KEY "$VAR_KEY"
          diz VITE_SENTRY_DSN               "$VAR_DSN"
          echo "Em Secrets (o site NAO le daqui):"
          diz VITE_SUPABASE_URL             "$SEC_URL"
          diz VITE_SUPABASE_PUBLISHABLE_KEY "$SEC_KEY"
          if [ -n "$VAR_DSN" ]; then
            echo "=> Registro de erros LIGADO."
          else
            echo "=> Registro de erros desligado (o app funciona igual)."
          fi
          if [ -n "$VAR_URL" ] && [ -n "$VAR_KEY" ]; then
            echo "=> Vai subir em MODO ONLINE."
          else
            echo "=> Vai subir em MODO DEMO."
            echo "   Se acima aparecer 'definida' em Secrets e 'VAZIA' em Variables,"
            echo "   as duas foram guardadas na aba errada."
            echo "   Se as duas estiverem VAZIAS nos dois lugares, confira se o nome"
            echo "   esta exato (maiusculas incluidas) e se foram criadas como"
            echo "   variaveis DO REPOSITORIO, nao de um Environment."
          fi

      - name: Build
        env:
          GITHUB_PAGES: 'true'
          # Sem estas duas variáveis o site sobe em MODO DEMO, que é seguro
          # e não toca em banco nenhum. Para ligar o modo online, defina-as em
          # Settings → Secrets and variables → Actions → Variables.
          # A chave publicável é pública por natureza: quem protege os dados
          # é o RLS. NUNCA use aqui a chave service_role.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Registro de erros. Sem ela o app funciona igual, só sem registro.
          # O DSN é público por natureza — vai dentro do pacote do navegador,
          # e quem protege o projeto no Sentry é a lista de domínios permitidos
          # configurada lá. Por isso fica em Variables, como as de cima.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          # Vazia: o site fica em github.io/saas/. Preenchida (por exemplo
          # `conexao.qidominios.com.br`): passa para a raiz do domínio próprio.
          # Ver o comentário em vite.config.ts — e o passo logo abaixo, que
          # lembra o que mais precisa mudar junto.
          DOMINIO_DO_SITE: ${{ vars.DOMINIO_DO_SITE }}
        run: npm run build

      # O GitHub Pages só serve num domínio próprio se encontrar um arquivo
      # CNAME na raiz do que foi publicado. Ele é escrito aqui, a partir da
      # mesma variável que decidiu a base — assim os dois não podem divergir.
      # Um CNAME versionado no repositório seria pior: valeria para toda
      # publicação, inclusive as que ainda deveriam sair em github.io.
      - name: Domínio próprio
        env:
          DOMINIO: ${{ vars.DOMINIO_DO_SITE }}
        run: |
          if [ -z "$DOMINIO" ]; then
            echo "Sem dominio proprio. O site sai em github.io/saas/."
            exit 0
          fi
          echo "$DOMINIO" > dist/CNAME
          echo "Publicando em https://$DOMINIO/ (raiz do dominio)."
          echo
          echo "=============================================================="
          echo " LEMBRETE: mais tres lugares apontam para o endereco do site."
          echo " Se algum ficar para tras, o login ou o pagamento quebra EM"
          echo " SILENCIO — sem erro em lugar nenhum que explique."
          echo
          echo "   1. Supabase - Authentication - URL Configuration - Site URL"
          echo "   2. Supabase - Authentication - URL Configuration - Redirect URLs"
          echo "   3. Supabase - Edge Functions - Secrets - URLS_DO_APP"
          echo
          echo " Os tres passam a ser:  https://$DOMINIO/"
          echo "=============================================================="

      # Confere o resultado, não a intenção: a URL tem de estar mesmo dentro
      # do JavaScript que vai para o ar.
      - name: Conferir o pacote publicado
        env:
          VAR_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          if [ -n "$VAR_URL" ] && grep -rqsF "$VAR_URL" dist/assets; then
            echo "MODO ONLINE confirmado: a URL do Supabase esta no pacote."
          else
            echo "MODO DEMO: o pacote nao contem a URL do Supabase."
          fi

          # A base errada nao da erro: da pagina em branco, com 404 em cada
          # arquivo. Conferir aqui e o que impede isso chegar ao ar.
          if grep -qE '(src|href)="/saas/assets/' dist/index.html; then
            NO_HTML="/saas/"
          else
            NO_HTML="/"
          fi
          if [ -f dist/CNAME ]; then
            ESPERADO="/"; ONDE="dominio proprio ($(cat dist/CNAME))"
          else
            ESPERADO="/saas/"; ONDE="github.io/saas/"
          fi
          echo "Destino: $ONDE — base esperada '$ESPERADO', o index.html usa '$NO_HTML'."
          if [ "$NO_HTML" != "$ESPERADO" ]; then
            echo "ERRO: a base do pacote nao bate com o destino."
            echo "Publicar assim daria pagina em branco. Abortando."
            exit 1
          fi
          echo "Base confere."

          # Instalacao no celular. Sao tres arquivos, e a falta de qualquer um
          # nao da erro nenhum: o Android simplesmente para de oferecer
          # "Instalar aplicativo", em silencio. Como o empacotamento para a
          # Play Store parte dai, uma publicacao sem eles quebraria a loja sem
          # avisar. Ver docs/CELULAR.md.
          FALTOU=""
          for f in manifest.webmanifest sw.js \
                   icones/icone-192.png icones/icone-512.png \
                   icones/icone-maskable-512.png icones/icone-apple-180.png; do
            [ -f "dist/$f" ] || FALTOU="$FALTOU $f"
          done
          if [ -n "$FALTOU" ]; then
            echo "ERRO: faltam arquivos do aplicativo de celular:$FALTOU"
            echo "Se foram apagados de public/, rode: python3 scripts/gerar-icones.py"
            exit 1
          fi
          if ! grep -qF "href=\"${ESPERADO}manifest.webmanifest\"" dist/index.html; then
            echo "ERRO: o index.html nao aponta para ${ESPERADO}manifest.webmanifest."
            exit 1
          fi
          echo "Aplicativo de celular: manifest, service worker e os quatro icones no lugar."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
