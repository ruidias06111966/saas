name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construir o site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Diz, no log, se o site vai subir em modo online ou demo — e, quando
      # estiver errado, onde está o engano. Nenhum valor é impresso: a chave
      # publicável é pública, mas segredo nenhum deve virar hábito de log.
      - name: Conferir a configuração
        env:
          VAR_URL: ${{ vars.VITE_SUPABASE_URL }}
          VAR_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Lidos só para detectar o engano mais comum: guardar em Secrets, que
          # é a aba vizinha. O site não lê daqui — o Build usa `vars.`.
          SEC_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SEC_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          diz() { if [ -n "$2" ]; then echo "  $1: definida"; else echo "  $1: VAZIA"; fi; }
          echo "Em Variables (é daqui que o site lê):"
          diz VITE_SUPABASE_URL             "$VAR_URL"
          diz VITE_SUPABASE_PUBLISHABLE_KEY "$VAR_KEY"
          echo "Em Secrets (o site NAO le daqui):"
          diz VITE_SUPABASE_URL             "$SEC_URL"
          diz VITE_SUPABASE_PUBLISHABLE_KEY "$SEC_KEY"
          if [ -n "$VAR_URL" ] && [ -n "$VAR_KEY" ]; then
            echo "=> Vai subir em MODO ONLINE."
          else
            echo "=> Vai subir em MODO DEMO."
            echo "   Se acima aparecer 'definida' em Secrets e 'VAZIA' em Variables,"
            echo "   as duas foram guardadas na aba errada."
            echo "   Se as duas estiverem VAZIAS nos dois lugares, confira se o nome"
            echo "   esta exato (maiusculas incluidas) e se foram criadas como"
            echo "   variaveis DO REPOSITORIO, nao de um Environment."
          fi

      - name: Build
        env:
          GITHUB_PAGES: 'true'
          # Sem estas duas variáveis o site sobe em MODO DEMO, que é seguro
          # e não toca em banco nenhum. Para ligar o modo online, defina-as em
          # Settings → Secrets and variables → Actions → Variables.
          # A chave publicável é pública por natureza: quem protege os dados
          # é o RLS. NUNCA use aqui a chave service_role.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      # Confere o resultado, não a intenção: a URL tem de estar mesmo dentro
      # do JavaScript que vai para o ar.
      - name: Conferir o pacote publicado
        env:
          VAR_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          if [ -n "$VAR_URL" ] && grep -rqsF "$VAR_URL" dist/assets; then
            echo "MODO ONLINE confirmado: a URL do Supabase esta no pacote."
          else
            echo "MODO DEMO: o pacote nao contem a URL do Supabase."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
