<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F1A2E" />
    <title>QICONEXÃO — quem sabe fazer, e quem precisa</title>
    <meta name="description" content="Publique o serviço que você precisa e receba propostas de profissionais da sua região — ou ofereça o que você sabe fazer para quem já está procurando." />

    <!-- Open Graph — o cartão que aparece quando alguém cola o endereço no
         WhatsApp, Instagram, Facebook ou LinkedIn. Sem estas tags o link vira
         uma caixa cinza com a URL crua, e num produto que cresce por indicação
         esse é o primeiro contato de muita gente.

         A URL da imagem TEM de ser absoluta: o robô que lê a página não tem
         "página atual" para resolver um caminho relativo, e ignora em silêncio.
         `%ORIGEM_DO_SITE%` é trocado no build (ver vite.config.ts) pela mesma
         variável que decide a base, para as duas nunca divergirem. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QICONEXÃO" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="%ORIGEM_DO_SITE%/" />
    <meta property="og:title" content="QICONEXÃO — quem sabe fazer, e quem precisa" />
    <meta property="og:description" content="Contador, engenheiro, advogado, quem cuida de alvará, quem faz site. Publique o que você precisa e receba propostas de gente da sua região — ou ofereça o que você sabe fazer para quem já está procurando." />
    <meta property="og:image" content="%ORIGEM_DO_SITE%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="O nome QICONEXÃO ao lado de duas balas de fala, com a frase: quem sabe fazer, e quem precisa." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Instalação no celular. O manifest e os ícones são o que faz o Android
         oferecer "Instalar aplicativo"; o iOS ignora o manifest e lê o
         apple-touch-icon. Ver docs/CELULAR.md.
         %BASE_URL% é trocado pelo Vite na hora do build: vale "/" no domínio
         próprio e "/saas/" no github.io, sem editar nada aqui. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icones/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%BASE_URL%icones/icone-apple-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="QICONEXÃO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
